<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="wmTitle wmDesc">
  <title id="wmTitle">The Archive of Unfinished Lives</title>
  <desc id="wmDesc">Horizontal wordmark on a dark ground: the ink-stained case file with a brass seal, followed by the title "The Archive of Unfinished Lives" set in a serif face.</desc>

  <!-- mark, scaled from favicon.svg -->
  <g transform="translate(26 50) scale(1.875)">
    <rect width="64" height="64" rx="8" fill="#17130e"/>
    <path d="M18 12h22a3 3 0 0 1 3 3v34a3 3 0 0 1-3 3H18z" fill="#e9e2d0"/>
    <path d="M22 20h15M22 26h15M22 32h15M22 38h9" stroke="#8e2b2b" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <circle cx="44" cy="42" r="12" fill="none" stroke="#b8912f" stroke-width="2.5"/>
    <circle cx="44" cy="42" r="6" fill="#b8912f"/>
    <path d="M30 12h10v9l-5-3-5 3z" fill="#b8912f"/>
  </g>

  <!-- divider -->
  <rect x="163" y="52" width="2" height="116" rx="1" fill="#b8912f" opacity=".55"/>

  <!-- wordmark -->
  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif">
    <text x="186" y="100" font-size="30" letter-spacing="10" fill="#c4b79b">THE ARCHIVE OF</text>
    <text x="186" y="158" font-size="60" letter-spacing="2.5" fill="#e9e2d0">UNFINISHED LIVES</text>
  </g>
  <rect x="186" y="176" width="646" height="2" rx="1" fill="#e9e2d0" opacity=".18"/>
</svg>
